<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Le site du resto">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <title>Le Resto - Menu</title>
    <link rel="stylesheet" href="./styles/testimony.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <a href="#" class="scroll-haut">▲</a>

    <header>
        <div class="headerNav">
            <h1>Le RESTO</h1>
            <nav class="desktop-nav">
                <a href="./index.html">Accueil</a>
                <a href="./menu.html">Menu</a>
                <a href="/le-resto.html">Le Resto</a>
                <a href="./contact.html">Contact</a>
            </nav>
        </div>
        <div id="burger">

            <button id="open" type="button">≡</button>
            <button id="close" type="button">×</button>

            <nav class="burger-nav">
                <a href="./index.html">Accueil</a>
                <a href="./menu.html">Menu</a>
                <a href="/le-resto.html">Le Resto</a>
                <a href="./contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="banner">
            <div class="overlay">
                <h2>Le menu</h2>
            </div>
        </div>
        <section id="suggestions">
            <h2>Nos suggestions</h2>
            <div class="trait-titre"></div>
            <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                        aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                        aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="./images/fajitas.jpg" class="d-block w-100" alt="Notre pain">
                        <div class="carousel-caption d-block ">
                            <h3 class="title-carousel">Poulet à la méditerranéenne</h3>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="./images/boeuf.jpg" class="d-block w-100" alt="Nos Vieinnoiseries">
                        <div class="carousel-caption  d-block ">
                            <h3 class="title-carousel">Côte de boeuf romarin</h3>
                        </div>
                    </div>
                    <div class="carousel-item">
                        <img src="./images/salade_poulet.jpg" class="d-block w-100" alt="Nos patisseries">
                        <div class="carousel-caption d-block">
                            <h3 class="title-carousel">Salade au poulet</h3>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <section id="menu">
            <h2>La carte</h2>
            <div class="card_container">
                <div class="card">
                    <div class="card_img"></div>
                    <h3>Les boissons</h3>
                    <button class="menu-button">Voir</button>
                </div>
                <div class="card">
                    <div class="card_img"></div>
                    <h3>Entrées et plats</h3>
                    <button class="menu-button">Voir</button>
                </div>
                <div class="card">
                    <div class="card_img"></div>
                    <h3>Les desserts</h3>
                    <button class="menu-button">Voir</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
    </footer>
    <script src="./js/testimony.js"></script>
    <script src="./js/burger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
